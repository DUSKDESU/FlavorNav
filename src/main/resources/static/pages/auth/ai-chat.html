<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手 - 寻味华夏</title>
    <link rel="icon" href="/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/css/ai-chat.css">
</head>
<body>
    <div class="top-nav">
        <div class="nav-left">
            <button class="back-btn-nav" onclick="goBack()">← 返回</button>
            <div class="page-title">AI美食助手</div>
        </div>
    </div>

    <div class="main-container">
        <div class="location-info" id="locationInfo">
            <div class="location-icon"></div>
            <div class="location-text" id="locationText">正在获取您的位置...</div>
        </div>

        <div class="quick-actions">
            <button class="action-btn" onclick="quickRecommend()">
                <span class="action-icon"></span>
                <span>推荐当地美食</span>
            </button>
            <button class="action-btn" onclick="quickAsk('有什么值得尝试的早餐？')">
                <span class="action-icon"></span>
                <span>当地早餐推荐</span>
            </button>
            <button class="action-btn" onclick="quickAsk('有什么必吃的小吃？')">
                <span class="action-icon"></span>
                <span>特色小吃</span>
            </button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <div class="welcome-icon"></div>
                <h3>我是您的AI美食助手</h3>
                <p>告诉我您当前的位置，我将为您推荐当地特色美食！</p>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="messageInput" placeholder="输入您的问题，例如：当地有什么特色美食？" onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script src="/js/ai-chat.js"></script>
</body>
</html>
