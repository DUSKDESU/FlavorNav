
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市美食 - 寻味华夏</title>
    <link rel="icon" href="/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/css/city-food.css">
    <link rel="stylesheet" href="/css/food-card.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <div class="nav-left">
            <button class="back-btn-nav" onclick="goBack()">← 返回</button>
            <div class="city-title" id="cityTitle">芜湖市美食</div>
        </div>
        <div class="nav-right">
            <button class="add-food-btn" onclick="openAddModal()">+ 添加美食</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 美食帖子列表 - 使用网格布局 -->
        <div class="food-card-grid" id="foodList">
            <!-- 动态加载美食帖子 -->
        </div>
    </div>

    <!-- 添加美食弹窗 -->
    <div class="modal-overlay" id="addModal" onclick="handleModalClick(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h2>创建美食帖子</h2>
                <button class="close-btn" onclick="closeAddModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>所在地区</label>
                    <input type="text" id="regionName" readonly>
                </div>
                <div class="form-group">
                    <label>美食名称</label>
                    <input type="text" id="foodName" placeholder="例如：北京烤鸭">
                </div>
                <div class="form-group">
                    <label>美食描述</label>
                    <textarea id="foodDescription" placeholder="介绍一下这道美食的特色..."></textarea>
                </div>
                <div class="form-group">
                    <label>主要食材</label>
                    <input type="text" id="foodIngredients" placeholder="例如：鸭子、面饼、葱丝">
                </div>
                <div class="form-group">
                    <label>制作方法</label>
                    <textarea id="foodCookingMethod" placeholder="详细描述这道美食的制作步骤..."></textarea>
                </div>
                <div class="form-group">
                    <label>历史渊源</label>
                    <textarea id="foodHistory" placeholder="这道美食的历史背景、传说故事..."></textarea>
                </div>
                <div class="form-group">
                    <label>美食分类</label>
                    <div class="type-tags-container">
                        <label class="type-tag"><input type="radio" name="foodType" value="主食"><span>主食</span></label>
                        <label class="type-tag"><input type="radio" name="foodType" value="菜肴"><span>菜肴</span></label>
                        <label class="type-tag"><input type="radio" name="foodType" value="汤羹"><span>汤羹</span></label>
                        <label class="type-tag"><input type="radio" name="foodType" value="饮品"><span>饮品</span></label>
                        <label class="type-tag"><input type="radio" name="foodType" value="零食/小食"><span>零食/小食</span></label>
                        <label class="type-tag"><input type="radio" name="foodType" value="甜品/冻品"><span>甜品/冻品</span></label>
                        <label class="type-tag"><input type="radio" name="foodType" value="生鲜/原材"><span>生鲜/原材</span></label>
                        <label class="type-tag"><input type="radio" name="foodType" value="速食/包装食品"><span>速食/包装食品</span></label>
                    </div>
                    <div class="custom-type-input">
                        <input type="text" id="customType" placeholder="或自定义分类名称..." maxlength="20">
                    </div>
                </div>

                <div class="form-group">
                    <label>主要味道（可多选）</label>
                    <div class="taste-tags-container">
                        <div class="taste-category">
                            <span class="taste-category-label">基础味觉层</span>
                            <div class="taste-tags">
                                <label class="taste-tag"><input type="checkbox" name="taste" value="酸"><span>酸</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="甜"><span>甜</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="苦"><span>苦</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="辣"><span>辣</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="咸"><span>咸</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="鲜"><span>鲜</span></label>
                            </div>
                        </div>
                        <div class="taste-category">
                            <span class="taste-category-label">口感/质地层</span>
                            <div class="taste-tags">
                                <label class="taste-tag"><input type="checkbox" name="taste" value="涩"><span>涩</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="香"><span>香</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="麻"><span>麻</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="油腻"><span>油腻</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="清爽"><span>清爽</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="顺滑"><span>顺滑</span></label>
                            </div>
                        </div>
                        <div class="taste-category">
                            <span class="taste-category-label">风格/风味层</span>
                            <div class="taste-tags">
                                <label class="taste-tag"><input type="checkbox" name="taste" value="烟熏味"><span>烟熏味</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="酒香"><span>酒香</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="膻味"><span>膻味</span></label>
                            </div>
                        </div>
                        <div class="taste-category">
                            <span class="taste-category-label">特殊体验层</span>
                            <div class="taste-tags">
                                <label class="taste-tag"><input type="checkbox" name="taste" value="回甘"><span>回甘</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="生津"><span>生津</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="锁喉"><span>锁喉</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="冰凉感"><span>冰凉感</span></label>
                                <label class="taste-tag"><input type="checkbox" name="taste" value="温热感"><span>温热感</span></label>
                            </div>
                        </div>
                    </div>
                    <div class="custom-taste-input">
                        <input type="text" id="customTaste" placeholder="或自定义味道名称（可添加多个，用逗号分隔）..." maxlength="50">
                    </div>
                </div>

                <div class="form-group">
                    <label>美食图片</label>
                    <div class="image-upload-area" id="imageUploadArea" onclick="document.getElementById('foodImage').click()">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击上传图片</div>
                        <div class="upload-hint">支持 JPG、PNG 格式，最大 5MB</div>
                    </div>
                    <input type="file" id="foodImage" accept="image/*" style="display: none;" onchange="previewImage(this)">
                    <img id="imagePreview" class="image-preview" alt="预览">
                </div>
                <div class="modal-buttons">
                    <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                    <button class="btn btn-primary" onclick="submitFood()">提交</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 美食详情弹窗 -->
    <div class="modal-overlay" id="detailModal" onclick="handleDetailModalClick(event)">
        <div class="detail-modal-content">
            <div class="detail-header">
                <h2>美食详情</h2>
                <button class="close-btn" onclick="closeDetailModal()">✕</button>
            </div>

            <div class="bilibili-post-wrapper" id="detailBody">
            </div>

            <div class="comment-section">
                <div class="comment-header">
                    <h3>💬 评论 <span id="commentCount" class="comment-count">0</span></h3>
                    <div class="comment-sort">
                        <span class="sort-item active" onclick="FoodCardComponent.sortComments('latest')">最新</span>
                        <span class="sort-divider">|</span>
                        <span class="sort-item" onclick="FoodCardComponent.sortComments('hot')">最热</span>
                    </div>
                </div>

                <div class="comment-input-box">
                    <div class="comment-input-wrapper">
                        <textarea id="commentInput" placeholder="说点什么..." rows="2"></textarea>
                        <div class="comment-submit-bar">
                            <span class="comment-hint">文明评论，理性发言</span>
                            <button class="btn btn-primary btn-sm" onclick="FoodCardComponent.submitComment()">发布</button>
                        </div>
                    </div>
                </div>

                <div class="comment-list-container" id="commentList">
                    <div class="comment-empty-state">
                        <div class="comment-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                        <p>暂无评论，来说两句吧</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/food-card.js"></script>
    <script src="/js/city-food.js"></script>
</body>
</html>
