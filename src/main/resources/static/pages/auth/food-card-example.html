
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食卡片组件使用示例</title>
    <link rel="stylesheet" href="/css/food-card.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f6f7f8;
            min-height: 100vh;
        }

        .top-nav {
            background: #ffffff;
            height: 60px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn-nav {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #61666d;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .back-btn-nav:hover {
            background: #f1f2f3;
            color: #18191c;
        }

        .page-title {
            margin-left: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #18191c;
        }

        .main-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e3e5e7;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #ff6b35;
        }

        .search-btn {
            padding: 12px 24px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #e55a2b;
        }

        .result-info {
            margin-bottom: 16px;
            color: #61666d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <button class="back-btn-nav" onclick="goBack()">← 返回</button>
        <div class="page-title">🍜 美食卡片组件示例</div>
    </div>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 搜索框 -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="搜索美食..." onkeyup="handleEnter(event)">
            <button class="search-btn" onclick="searchFoods()">搜索</button>
        </div>

        <!-- 结果信息 -->
        <div class="result-info" id="resultInfo"></div>

        <!-- 美食卡片列表 -->
        <div class="food-card-list" id="foodList">
            <div class="empty-state">
                <div class="empty-state-icon">🔍</div>
                <div class="empty-state-text">输入关键词搜索美食</div>
            </div>
        </div>
    </div>

    <!-- 美食详情弹窗 -->
    <div class="modal-overlay" id="detailModal" onclick="handleDetailModalClick(event)">
        <div class="detail-modal-content">
            <div class="detail-header">
                <h2>美食详情</h2>
                <button class="close-btn" onclick="closeDetailModal()">✕</button>
            </div>

            <div class="bilibili-post-wrapper" id="detailBody">
                <!-- 帖子内容将在这里动态渲染 -->
            </div>

            <div class="comment-section">
                <div class="comment-header">
                    <h3>💬 评论 <span id="commentCount" class="comment-count">0</span></h3>
                    <div class="comment-sort">
                        <span class="sort-item active">最新</span>
                        <span class="sort-divider">|</span>
                        <span class="sort-item">最热</span>
                    </div>
                </div>

                <div class="comment-input-box">
                    <div class="comment-input-wrapper">
                        <textarea id="commentInput" placeholder="说点什么..." rows="2"></textarea>
                        <div class="comment-submit-bar">
                            <span class="comment-hint">文明评论，理性发言</span>
                            <button class="btn btn-primary btn-sm" onclick="submitComment()">发布</button>
                        </div>
                    </div>
                </div>

                <div class="comment-list-container" id="commentList">
                    <div class="comment-empty-state">
                        <div class="comment-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                        <p>暂无评论，来说两句吧</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入美食卡片组件 -->
    <script src="/js/food-card.js"></script>

    <!-- 页面逻辑 -->
    <script>
        const API_BASE = '/api';

        // 初始化组件
        FoodCardComponent.init({
            apiBaseUrl: API_BASE
        });

        function handleEnter(event) {
            if (event.key === 'Enter') {
                searchFoods();
            }
        }

        async function searchFoods() {
            const keyword = document.getElementById('searchInput').value.trim();

            if (!keyword) {
                alert('请输入搜索关键词');
                return;
            }

            try {
                const response = await fetch(API_BASE + '/foods/search?keyword=' + encodeURIComponent(keyword));
                const result = await response.json();

                const foodList = document.getElementById('foodList');
                const resultInfo = document.getElementById('resultInfo');

                if (result.code === 200 && result.data && result.data.length > 0) {
                    resultInfo.textContent = '找到 ' + result.data.length + ' 个相关美食';
                    // 使用组件渲染美食卡片列表
                    foodList.innerHTML = FoodCardComponent.renderFoodCardList(result.data, keyword);
                } else {
                    resultInfo.textContent = '';
                    foodList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">😔</div>
                            <div class="empty-state-text">未找到相关美食</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('搜索失败:', error);
                document.getElementById('foodList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-text">搜索失败，请稍后重试</div>
                    </div>
                `;
            }
        }

        function goBack() {
            window.location.href = '/pages/auth/main/map.html';
        }
    </script>
</body>
</html>
