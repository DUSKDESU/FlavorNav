
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - 寻味华夏</title>
    <link rel="icon" href="/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/food-card.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <div class="nav-left">
            <button class="back-btn-nav" onclick="goBack()">← 返回</button>
            <div class="page-title">个人主页</div>
        </div>
    </div>

    <!-- 个人主页头部 -->
    <div class="profile-header">
        <div class="profile-banner">
            <div class="banner-bg"></div>
            <div class="profile-info">
                <div class="avatar-wrapper">
                    <img id="userAvatar" class="user-avatar" src="" alt="头像">
                    <div class="avatar-badge">♂</div>
                </div>
                <div class="user-details">
                    <h1 class="username" id="username"></h1>
                    <div class="user-stats">
                        <div class="stat-item" onclick="showFollowings()">
                            <span class="stat-value" id="followingCount">0</span>
                            <span class="stat-label">关注</span>
                        </div>
                        <div class="stat-item" onclick="showFollowers()">
                            <span class="stat-value" id="followerCount">0</span>
                            <span class="stat-label">粉丝</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="likeCount">0</span>
                            <span class="stat-label">获赞</span>
                        </div>
                    </div>
                    <div class="profile-actions-row">
                        <button class="follow-btn" id="followBtn" style="display: none;" onclick="toggleFollow()">
                            <span class="follow-text">+ 关注</span>
                        </button>
                        <button class="admin-entry-btn" id="adminEntryBtn" style="display: none;" onclick="goToAdminSystem()">
                            <span class="admin-icon">⚙️</span>
                            <span class="admin-text">管理系统</span>
                        </button>
                    </div>
                    <div class="user-signature" id="userSignature"></div>
                    <button class="edit-signature-btn" id="editProfileBtn" style="display: none;" onclick="openEditProfileModal()">编辑个人资料</button>
                </div>
            </div>
        </div>

        <!-- 导航标签 -->
        <div class="profile-tabs">
            <div class="tab-item active" data-tab="foods" onclick="switchTab('foods')">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12h16"/>
                    <path d="M6 12a6 6 0 0 1 12 0"/>
                    <path d="M10 6v4"/>
                    <path d="M14 6v4"/>
                </svg>
                <span>美食</span>
            </div>
            <div class="tab-item" data-tab="favorites" onclick="switchTab('favorites')">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
                <span>我的收藏</span>
            </div>
            <div class="tab-item" data-tab="followers" onclick="showFollowers()">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>粉丝</span>
            </div>
            <div class="tab-item" data-tab="followings" onclick="showFollowings()">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>关注</span>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-container">

        <!-- 收藏展示区 -->
        <div class="content-section" id="favoritesSection" style="display: none;">
            <div class="section-header">
                <h2>收藏的美食</h2>
            </div>
            <div class="food-card-grid" id="favoriteGrid">
                <!-- 动态加载收藏美食 -->
            </div>
        </div>

        <!-- 美食展示区 -->
        <div class="content-section" id="foodsSection">
            <div class="section-header">
                <h2>发布的美食</h2>
                <div class="sort-buttons">
                    <button class="sort-btn active" onclick="sortFoods('latest')">最新发布</button>
                    <button class="sort-btn" onclick="sortFoods('popular')">最多获赞</button>
                </div>
            </div>
            <div class="food-card-grid" id="foodGrid">
                <!-- 动态加载美食 -->
            </div>
        </div>

        <!-- 粉丝列表 -->
        <div class="content-section" id="followersSection" style="display: none;">
            <div class="section-header">
                <h2>粉丝 <span class="count-badge" id="followersCount">0</span></h2>
            </div>
            <div class="user-list" id="followersList">
                <!-- 动态加载粉丝列表 -->
            </div>
        </div>

        <!-- 关注列表 -->
        <div class="content-section" id="followingsSection" style="display: none;">
            <div class="section-header">
                <h2>关注 <span class="count-badge" id="followingsCount">0</span></h2>
            </div>
            <div class="user-list" id="followingsList">
                <!-- 动态加载关注列表 -->
            </div>
        </div>
    </div>

    <!-- 美食详情弹窗 -->
    <div class="modal-overlay" id="detailModal" onclick="FoodCardComponent.handleModalClick(event)">
        <div class="detail-modal-content">
            <div class="detail-header">
                <h2>美食详情</h2>
                <button class="close-btn" onclick="FoodCardComponent.closeDetail()">✕</button>
            </div>

            <div class="bilibili-post-wrapper" id="detailBody">
            </div>

            <div class="comment-section">
                <div class="comment-header">
                    <h3>💬 评论 <span id="commentCount" class="comment-count">0</span></h3>
                    <div class="comment-sort">
                        <span class="sort-item active" onclick="sortComments('latest')">最新</span>
                        <span class="sort-divider">|</span>
                        <span class="sort-item" onclick="sortComments('hot')">最热</span>
                    </div>
                </div>

                <div class="comment-input-box">
                    <div class="comment-input-wrapper">
                        <textarea id="commentInput" placeholder="说点什么..." rows="2"></textarea>
                        <div class="comment-submit-bar">
                            <span class="comment-hint">文明评论，理性发言</span>
                            <button class="btn btn-primary btn-sm" onclick="FoodCardComponent.submitComment()">发布</button>
                        </div>
                    </div>
                </div>

                <div class="comment-list-container" id="commentList">
                    <div class="comment-empty-state">
                        <div class="comment-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                        <p>暂无评论，来说两句吧</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 粉丝/关注弹窗 -->
    <div class="modal-overlay" id="userListModal" onclick="handleModalClick(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">粉丝列表</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 用户列表 -->
            </div>
        </div>
    </div>

    <!-- 编辑个人资料弹窗 -->
    <div class="modal-overlay" id="editProfileModal" onclick="closeEditProfileModal(event)">
        <div class="modal-content profile-edit-modal">
            <div class="modal-header">
                <h2>编辑个人资料</h2>
                <button class="close-btn" onclick="closeEditProfileModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>头像</label>
                    <div class="avatar-upload-box">
                        <img id="avatarPreview" src="" alt="avatar" class="avatar-preview">
                        <label class="avatar-upload-btn">
                            <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="previewAvatar(this)">
                            更换头像
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="usernameInput" placeholder="请输入用户名" maxlength="20" class="form-input">
                </div>

                <div class="form-group">
                    <label>个性签名</label>
                    <textarea id="signatureInput" placeholder="写点什么介绍自己吧..." maxlength="200" class="form-textarea" rows="3"></textarea>
                    <div class="char-count"><span id="charCount">0</span>/200</div>
                </div>

                <div class="form-actions">
                    <button class="cancel-btn" onclick="closeEditProfileModal()">取消</button>
                    <button class="save-btn" onclick="saveProfile()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/food-card.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
